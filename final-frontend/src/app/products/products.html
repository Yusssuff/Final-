<div
  class="min-h-screen bg-[#080b12] px-4 py-6 text-white sm:px-6 lg:px-8"
>
  <div class="mx-auto max-w-7xl">

    <!-- Header -->
    <div
      class="mb-8 flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between"
    >

      <div>

        <p
          class="text-xs font-semibold uppercase tracking-[0.18em] text-indigo-400"
        >
          SalesBuzz
        </p>

        <h1
          class="mt-2 text-3xl font-semibold tracking-tight"
        >
          Products
        </h1>

        <p
          class="mt-2 text-sm text-slate-400"
        >
          Manage your products and inventory.
        </p>

      </div>

      <button
        type="button"
        (click)="refresh()"
        class="rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-indigo-500"
      >
        Refresh
      </button>

    </div>

    <!-- Search -->
    <section
      class="mb-6 rounded-2xl bg-[#111620] p-4"
    >

      <div
        class="flex flex-col gap-3 sm:flex-row"
      >

        <input
          type="text"
          [(ngModel)]="searchValue"
          (input)="searchProducts($event)"
          placeholder="Search by ID, name or description..."
          class="w-full rounded-xl bg-[#1a202c] px-4 py-3.5 text-sm text-white placeholder:text-slate-500 outline-none ring-1 ring-white/5 focus:ring-2 focus:ring-indigo-500/50"
        />

        <button
          type="button"
          (click)="clearSearch()"
          class="rounded-xl bg-slate-800 px-5 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-700 hover:text-white"
        >
          Clear
        </button>

      </div>

    </section>

    <!-- BI GRID -->
    <div
      class="overflow-hidden rounded-2xl bg-[#111620]"
    >

      <BI-Grid
        #productsGrid

        [DataService]="dataSource"

        [changeSet]="changeSet"

        [Columns]="columns"

        [GridName]="'Products'"

        [DomID]="'Products_Grid'"

        [HasPaging]="true"

        [HasSelectAll]="false"

        [HasExport]="false"

        [height]="500"
      >
      </BI-Grid>

    </div>

  </div>
</div>
